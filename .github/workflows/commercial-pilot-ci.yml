name: Commercial pilot validation
on:
  pull_request:
    paths:
      - 'lib/contact.js'
      - 'app/negocios/**'
      - 'app/para-negocios/**'
      - 'tests/monetization-links.test.mjs'
      - '.github/workflows/commercial-pilot-ci.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/monetization-links.test.mjs
